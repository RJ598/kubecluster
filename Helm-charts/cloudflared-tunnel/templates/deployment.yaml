{{- with .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-deploy
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .serviceAccount.create }}
      serviceAccountName: cloudflared-sa
      {{- end }}

      securityContext:
        runAsUser: 1
        runAsGroup: 1
        fsGroup: 1

      containers:
        - name: {{ .name }}
          image: cloudflare/cloudflared:{{ $.Chart.AppVersion }}
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-token
                  key: token

          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
            - --token
            - $(TUNNEL_TOKEN)

          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: {{ .name }}-config
{{- end }}