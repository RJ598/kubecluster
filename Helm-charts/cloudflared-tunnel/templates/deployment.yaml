{{- with .Values }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-deploy
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      {{- if .serviceAccount.create }}
      serviceAccountName: cloudflared-sa
      {{- end }}

      securityContext:
        runAsUser: 1
        runAsGroup: 1
        fsGroup: 1

      containers:
        - name: {{ .name }}
          image: cloudflare/cloudflared:{{ $.Chart.AppVersion }}

          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run

          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true

            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: {{ .name }}-config

        - name: creds
          secret:
            secretName: {{ .secretName }}
{{- end }}