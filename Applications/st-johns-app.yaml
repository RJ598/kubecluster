apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school-website
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RJ598/kubecluster
    targetRevision: main
    path: Applications/st-johns-school

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true