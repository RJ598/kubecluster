apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: school-website
  template:
    metadata:
      labels:
        app: school-website
    spec:
      containers:
        - name: school-website
          image: rj598/school-website:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20